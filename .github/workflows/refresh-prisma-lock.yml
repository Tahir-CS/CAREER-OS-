name: Refresh backend Prisma lockfile

on:
  push:
    branches: ["fix/prisma7-backend-ci"]
    paths: [".github/workflows/refresh-prisma-lock.yml"]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/prisma7-backend-ci

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Pin Prisma 6.19 and refresh lockfile
        working-directory: Backend
        run: |
          npm install --save-exact @prisma/client@6.19.0
          npm install --save-dev --save-exact prisma@6.19.0

      - name: Verify Prisma client generation
        working-directory: Backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/careeros?schema=public
        run: npx prisma generate

      - name: Verify Prisma client construction
        working-directory: Backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/careeros?schema=public
        run: node --input-type=module -e "import { PrismaClient } from '@prisma/client'; const prisma = new PrismaClient(); console.log('PrismaClient constructed');"

      - name: Commit generated package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Backend/package.json Backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No package metadata changes to commit"
            exit 0
          fi
          git commit -m "Pin backend Prisma to 6.19 for compatibility"
          git push origin HEAD:fix/prisma7-backend-ci
